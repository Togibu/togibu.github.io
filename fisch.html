<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hyper-Realistic Aquarium</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
            touch-action: none; /* Prevent scrolling on mobile */
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="aquarium-canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('aquarium-canvas');
        const ctx = canvas.getContext('2d');

        let width, height, waterLevel;
        let timeElapsed = 0;
        
        // Input state
        const mouse = {
            x: 0, y: 0,
            prevX: 0, prevY: 0,
            isDown: false,
            history: [] // Used to calculate velocity on release
        };
        
        let grabbedFish = null;
        const fishes = [];
        const deadFishes = [];
        const particles = [];
        const bubbles = [];

        // Water surface parameters
        const SPRING_COUNT = 250;
        const TENSION = 0.025;
        const DAMPENING = 0.025;
        const SPREAD = 0.25;
        let springs = [];

        class Spring {
            constructor() {
                this.y = 0;
                this.velocity = 0;
            }
            update() {
                const acceleration = -TENSION * this.y - DAMPENING * this.velocity;
                this.velocity += acceleration;
                this.y += this.velocity;
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            waterLevel = height * 0.3; // Water starts at 30% from top
            
            springs = [];
            for (let i = 0; i < SPRING_COUNT; i++) {
                springs.push(new Spring());
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function updateWaterSurface() {
            for (let i = 0; i < SPRING_COUNT; i++) {
                springs[i].update();
            }

            let leftDeltas = new Float32Array(SPRING_COUNT);
            let rightDeltas = new Float32Array(SPRING_COUNT);

            for (let pass = 0; pass < 8; pass++) {
                for (let i = 0; i < SPRING_COUNT; i++) {
                    if (i > 0) {
                        leftDeltas[i] = SPREAD * (springs[i].y - springs[i - 1].y);
                        springs[i - 1].velocity += leftDeltas[i];
                    }
                    if (i < SPRING_COUNT - 1) {
                        rightDeltas[i] = SPREAD * (springs[i].y - springs[i + 1].y);
                        springs[i + 1].velocity += rightDeltas[i];
                    }
                }
                for (let i = 0; i < SPRING_COUNT; i++) {
                    if (i > 0) springs[i - 1].y += leftDeltas[i];
                    if (i < SPRING_COUNT - 1) springs[i + 1].y += rightDeltas[i];
                }
            }
        }

        function splash(x, force) {
            const index = Math.floor((x / width) * Math.max(SPRING_COUNT - 1, 1));
            if (index >= 0 && index < SPRING_COUNT) {
                springs[index].velocity += force;
            }
        }

        function createSplashParticles(x, y, amount, spread = 8, lift = -5) {
            for(let i=0; i<amount; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * spread,
                    vy: (Math.random() * lift) - 2,
                    life: 1.0,
                    size: Math.random() * 4 + 2,
                    decay: Math.random() * 0.02 + 0.01
                });
            }
        }

        function spawnBubble(x, y) {
            bubbles.push({
                x: x,
                y: y,
                radius: Math.random() * 3 + 1,
                speed: Math.random() * 1.5 + 0.5,
                wobble: Math.random() * Math.PI * 2,
                offset: (Math.random() - 0.5) * 2
            });
        }

        class DeadFishPiece {
            constructor(x, y, vx, vy, colorPrimary, colorSecondary, scale, parts) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.rotation = 0;
                this.angularVelocity = (Math.random() - 0.5) * 0.15;
                this.colorPrimary = colorPrimary;
                this.colorSecondary = colorSecondary;
                this.scale = scale;
                this.parts = parts;
                this.deathTime = Date.now();
            }

            update() {
                this.vy += 0.05; // Sinking gravity
                this.vx *= 0.95; // Water drag
                this.vy *= 0.95;
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.angularVelocity;

                // Hit sand bottom
                if (this.y > height - 35) {
                    this.y = height - 35;
                    this.vy = 0;
                    this.vx *= 0.7; // Friction on sand
                    this.angularVelocity *= 0.8;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                for (let part of this.parts) {
                    if (part.type === 'polygon') {
                        ctx.fillStyle = part.color === 'primary' ? this.colorPrimary : this.colorSecondary;
                        ctx.beginPath();
                        if(part.points.length > 0) {
                            ctx.moveTo(part.points[0].x, part.points[0].y);
                            for (let i = 1; i < part.points.length; i++) {
                                ctx.lineTo(part.points[i].x, part.points[i].y);
                            }
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = "rgba(0,0,0,0.1)";
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    } else if (part.type === 'eye') {
                        let ex = part.x;
                        let ey = part.y;
                        ctx.fillStyle = '#333';
                        ctx.beginPath();
                        ctx.arc(ex, ey, 3.5 * this.scale, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(ex - 2, ey - 2); ctx.lineTo(ex + 2, ey + 2);
                        ctx.moveTo(ex + 2, ey - 2); ctx.lineTo(ex - 2, ey + 2);
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }
        }

        class Fish {
            constructor(x, y, scale, colorPrimary, colorSecondary) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.scale = scale;
                this.baseColorPrimary = colorPrimary;
                this.baseColorSecondary = colorSecondary;
                this.colorPrimary = colorPrimary;
                this.colorSecondary = colorSecondary;
                
                // 0: Swims, 1: Grabbed, 2: Airborne, 3: Falling in water, 4: Dead
                this.state = 0;
                this.radius = 25 * scale;
                this.maxSpeed = 3.5 * scale;
                
                this.numSegments = 10;
                this.segmentLength = 7 * scale;
                this.segments = [];
                for(let i=0; i<this.numSegments; i++) {
                    this.segments.push({x: this.x, y: this.y});
                }
                
                this.wanderAngle = Math.random() * Math.PI * 2;
                this.highestY = Infinity; // Track highest point thrown
                this.isDead = false;
                this.wasThrownByPlayer = false;
                this.jumpCooldown = Math.random() * 800 + 400; // Time before next jump
            }

            update() {
                if (this.state === 0) {
                    // SWIMMING
                    this.wander();
                    this.fleeMouse();
                    this.avoidBoundaries();
                    
                    let speed = Math.hypot(this.vx, this.vy);
                    if (speed > this.maxSpeed) {
                        this.vx = (this.vx / speed) * this.maxSpeed;
                        this.vy = (this.vy / speed) * this.maxSpeed;
                    }
                    this.x += this.vx;
                    this.y += this.vy;

                    // Random jump trigger
                    this.jumpCooldown--;
                    if (this.jumpCooldown <= 0) {
                        this.state = 5; // Start jump
                        this.jumpCooldown = Math.random() * 1000 + 800;
                    }

                } else if (this.state === 1) {
                    // GRABBED
                    this.x = mouse.x;
                    this.y = mouse.y;
                    if(mouse.history.length > 0) {
                        let oldest = mouse.history[0];
                        this.vx = (mouse.x - oldest.x) * 0.2; // Calculate throw velocity
                        this.vy = (mouse.y - oldest.y) * 0.2;
                    }

                } else if (this.state === 2) {
                    // AIRBORNE
                    this.vy += 0.3; // Gravity
                    this.x += this.vx;
                    this.y += this.vy;
                    
                    // Track max height
                    if (this.y < this.highestY) this.highestY = this.y;
                    
                    // Hit water surface
                    if (this.y > waterLevel) {
                        splash(this.x, this.vy * 2.5);
                        createSplashParticles(this.x, waterLevel, 25);
                        
                        // Check if thrown too high (less than 10% of screen height) AND was thrown by player
                        if (this.wasThrownByPlayer && this.highestY < height * 0.1) {
                            this.die();
                        } else {
                            this.state = 3; // Survive, fall into water
                        }
                    }

                } else if (this.state === 3) {
                    // FALLING/RECOVERING IN WATER
                    this.vy += 0.05; // Buoyancy/friction
                    this.vx *= 0.92;
                    this.vy *= 0.92;
                    this.x += this.vx;
                    this.y += this.vy;
                    
                    if (Math.hypot(this.vx, this.vy) < 1.0 && this.y > waterLevel + 50) {
                        this.state = 0; // Return to swimming
                        this.highestY = Infinity;
                        this.wasThrownByPlayer = false;
                    }
                    this.avoidBoundaries();
                } else if (this.state === 5) {
                    // PREPARING TO JUMP (BURSTING UP)
                    this.steer(this.x, waterLevel - 200, 0.2); // Steer straight up
                    
                    let jumpSpeed = this.maxSpeed * 3.5;
                    let speed = Math.hypot(this.vx, this.vy);
                    if (speed > jumpSpeed) {
                        this.vx = (this.vx / speed) * jumpSpeed;
                        this.vy = (this.vy / speed) * jumpSpeed;
                    } else {
                        this.vy -= 0.6; // Accelerate upwards rapidly
                    }
                    this.x += this.vx;
                    this.y += this.vy;

                    // Breach surface
                    if (this.y < waterLevel) {
                        this.state = 2; // Airborne
                        this.wasThrownByPlayer = false; // Safe landing guaranteed
                        this.highestY = Infinity;
                        splash(this.x, this.vy * 2.5);
                        createSplashParticles(this.x, waterLevel, 25);
                    }
                }

                this.updateIK();
            }

            die() {
                this.isDead = true;
                
                // 1. Calculate final hull points to capture exact shape
                const widths = [];
                for(let i=0; i<this.numSegments; i++) {
                    let f = Math.sin((i / (this.numSegments - 1)) * Math.PI);
                    if(i===0) f = 0.6;
                    widths.push(f * 14 * this.scale);
                }

                const leftHull = [], rightHull = [];
                for (let i = 0; i < this.numSegments; i++) {
                    let angle = 0;
                    if (i < this.numSegments - 1) {
                        angle = Math.atan2(this.segments[i].y - this.segments[i+1].y, this.segments[i].x - this.segments[i+1].x);
                    } else {
                        angle = Math.atan2(this.segments[i-1].y - this.segments[i].y, this.segments[i-1].x - this.segments[i].x);
                    }

                    leftHull.push({
                        x: this.segments[i].x + Math.cos(angle - Math.PI/2) * widths[i],
                        y: this.segments[i].y + Math.sin(angle - Math.PI/2) * widths[i]
                    });
                    rightHull.push({
                        x: this.segments[i].x + Math.cos(angle + Math.PI/2) * widths[i],
                        y: this.segments[i].y + Math.sin(angle + Math.PI/2) * widths[i]
                    });
                }

                const mid = Math.floor(this.numSegments / 2);

                // Pale colors for dead flesh
                const deadPrimary = '#95a5a6';
                const deadSecondary = '#7f8c8d';

                // --- FRONT HALF ---
                const cxFront = this.segments[2].x;
                const cyFront = this.segments[2].y;

                const frontBodyPoly = [];
                for (let i = 0; i < mid; i++) frontBodyPoly.push({ x: leftHull[i].x - cxFront, y: leftHull[i].y - cyFront });
                for (let i = mid - 1; i >= 0; i--) frontBodyPoly.push({ x: rightHull[i].x - cxFront, y: rightHull[i].y - cyFront });

                let eyeAngle = Math.atan2(this.segments[0].y - this.segments[1].y, this.segments[0].x - this.segments[1].x);
                let ex = this.segments[0].x + Math.cos(eyeAngle - Math.PI/2) * widths[0] * 0.5 - cxFront;
                let ey = this.segments[0].y + Math.sin(eyeAngle - Math.PI/2) * widths[0] * 0.5 - cyFront;

                let frontPiece = new DeadFishPiece(
                    cxFront, cyFront,
                    this.vx - 1.5 + (Math.random() - 0.5), this.vy + (Math.random() - 0.5),
                    deadPrimary, deadSecondary, this.scale,
                    [
                        { type: 'polygon', color: 'primary', points: frontBodyPoly },
                        { type: 'eye', x: ex, y: ey }
                    ]
                );

                // --- BACK HALF ---
                const cxBack = this.segments[7].x;
                const cyBack = this.segments[7].y;

                const backBodyPoly = [];
                for (let i = mid; i < this.numSegments; i++) backBodyPoly.push({ x: leftHull[i].x - cxBack, y: leftHull[i].y - cyBack });
                for (let i = this.numSegments - 1; i >= mid; i--) backBodyPoly.push({ x: rightHull[i].x - cxBack, y: rightHull[i].y - cyBack });

                const tailIndex = this.numSegments - 1;
                const tailAngle = Math.atan2(this.segments[tailIndex-1].y - this.segments[tailIndex].y, 
                                             this.segments[tailIndex-1].x - this.segments[tailIndex].x);
                let tx = this.segments[tailIndex].x;
                let ty = this.segments[tailIndex].y;
                const tailPoly = [
                    { x: tx - cxBack, y: ty - cyBack },
                    { x: tx - Math.cos(tailAngle - 0.5)*28*this.scale - cxBack, y: ty - Math.sin(tailAngle - 0.5)*28*this.scale - cyBack },
                    { x: tx - Math.cos(tailAngle)*20*this.scale - cxBack, y: ty - Math.sin(tailAngle)*20*this.scale - cyBack },
                    { x: tx - Math.cos(tailAngle + 0.5)*28*this.scale - cxBack, y: ty - Math.sin(tailAngle + 0.5)*28*this.scale - cyBack }
                ];

                let backPiece = new DeadFishPiece(
                    cxBack, cyBack,
                    this.vx + 1.5 + (Math.random() - 0.5), this.vy + (Math.random() - 0.5),
                    deadPrimary, deadSecondary, this.scale,
                    [
                        { type: 'polygon', color: 'secondary', points: tailPoly },
                        { type: 'polygon', color: 'primary', points: backBodyPoly }
                    ]
                );

                deadFishes.push(frontPiece, backPiece);
                
                // Spawn a new fish offscreen to replace this one
                spawnNewFish();
            }

            wander() {
                this.wanderAngle += (Math.random() - 0.5) * 0.3;
                let futureX = this.x + this.vx * 20;
                let futureY = this.y + this.vy * 20;
                futureX += Math.cos(this.wanderAngle) * 35;
                futureY += Math.sin(this.wanderAngle) * 35;
                
                this.steer(futureX, futureY, 0.04);
            }

            fleeMouse() {
                if (grabbedFish) return; // Don't flee if dragging a fish
                let dist = Math.hypot(this.x - mouse.x, this.y - mouse.y);
                if (dist < 180 && mouse.y > waterLevel) {
                    let desiredX = this.x - mouse.x;
                    let desiredY = this.y - mouse.y;
                    let mag = Math.hypot(desiredX, desiredY);
                    desiredX = (desiredX / mag) * this.maxSpeed * 2.5;
                    desiredY = (desiredY / mag) * this.maxSpeed * 2.5;
                    
                    this.vx += (desiredX - this.vx) * 0.15;
                    this.vy += (desiredY - this.vy) * 0.15;
                }
            }

            avoidBoundaries() {
                let margin = 60;
                let steerX = 0, steerY = 0;
                let avoid = false;

                if (this.x < margin) { steerX = this.maxSpeed; avoid = true; }
                else if (this.x > width - margin) { steerX = -this.maxSpeed; avoid = true; }
                
                if (this.y < waterLevel + margin) { steerY = this.maxSpeed; avoid = true; }
                else if (this.y > height - margin - 20) { steerY = -this.maxSpeed; avoid = true; }

                if (avoid) {
                    this.vx += (steerX - this.vx) * 0.06;
                    this.vy += (steerY - this.vy) * 0.06;
                }
            }

            steer(targetX, targetY, force) {
                let desiredX = targetX - this.x;
                let desiredY = targetY - this.y;
                let d = Math.hypot(desiredX, desiredY);
                if (d > 0) {
                    desiredX = (desiredX / d) * this.maxSpeed;
                    desiredY = (desiredY / d) * this.maxSpeed;
                    this.vx += (desiredX - this.vx) * force;
                    this.vy += (desiredY - this.vy) * force;
                }
            }

            updateIK() {
                this.segments[0].x = this.x;
                this.segments[0].y = this.y;

                for (let i = 1; i < this.numSegments; i++) {
                let prev = this.segments[i - 1];
                let curr = this.segments[i];
                
                let dx = prev.x - curr.x;
                let dy = prev.y - curr.y;
                let dist = Math.hypot(dx, dy);
                
                if (dist > 0) {
                    let wiggle = 0;
                    if(this.state === 0 || this.state === 3) {
                        // Normal swim wiggle
                        let speed = Math.hypot(this.vx, this.vy);
                        wiggle = Math.sin(timeElapsed * 0.01 + i * 0.5) * (speed * 0.6) * (i/this.numSegments);
                    } else if (this.state === 1 || this.state === 5) {
                        // Struggle heavily when grabbed OR speeding up for a jump
                        wiggle = Math.sin(timeElapsed * 0.04 + i) * 5;
                    }

                    let angle = Math.atan2(dy, dx);
                        
                        curr.x = prev.x - Math.cos(angle) * this.segmentLength + Math.cos(angle + Math.PI/2) * wiggle;
                        curr.y = prev.y - Math.sin(angle) * this.segmentLength + Math.sin(angle + Math.PI/2) * wiggle;
                    }
                }
            }

            draw() {
                const widths = [];
                for(let i=0; i<this.numSegments; i++) {
                    let f = Math.sin((i / (this.numSegments - 1)) * Math.PI);
                    if(i===0) f = 0.6;
                    widths.push(f * 14 * this.scale);
                }

                const leftHull = [], rightHull = [];
                for (let i = 0; i < this.numSegments; i++) {
                    let angle = 0;
                    if (i < this.numSegments - 1) {
                        angle = Math.atan2(this.segments[i].y - this.segments[i+1].y, this.segments[i].x - this.segments[i+1].x);
                    } else {
                        angle = Math.atan2(this.segments[i-1].y - this.segments[i].y, this.segments[i-1].x - this.segments[i].x);
                    }

                    leftHull.push({
                        x: this.segments[i].x + Math.cos(angle - Math.PI/2) * widths[i],
                        y: this.segments[i].y + Math.sin(angle - Math.PI/2) * widths[i]
                    });
                    rightHull.push({
                        x: this.segments[i].x + Math.cos(angle + Math.PI/2) * widths[i],
                        y: this.segments[i].y + Math.sin(angle + Math.PI/2) * widths[i]
                    });
                }

                ctx.fillStyle = this.colorSecondary;
                ctx.beginPath();
                const tailIndex = this.numSegments - 1;
                const tailAngle = Math.atan2(this.segments[tailIndex-1].y - this.segments[tailIndex].y, 
                                             this.segments[tailIndex-1].x - this.segments[tailIndex].x);
                ctx.moveTo(this.segments[tailIndex].x, this.segments[tailIndex].y);
                ctx.lineTo(this.segments[tailIndex].x - Math.cos(tailAngle - 0.5)*28*this.scale, 
                           this.segments[tailIndex].y - Math.sin(tailAngle - 0.5)*28*this.scale);
                ctx.lineTo(this.segments[tailIndex].x - Math.cos(tailAngle)*20*this.scale, 
                           this.segments[tailIndex].y - Math.sin(tailAngle)*20*this.scale);
                ctx.lineTo(this.segments[tailIndex].x - Math.cos(tailAngle + 0.5)*28*this.scale, 
                           this.segments[tailIndex].y - Math.sin(tailAngle + 0.5)*28*this.scale);
                ctx.fill();

                ctx.fillStyle = this.colorPrimary;
                ctx.beginPath();
                for (let i = 0; i < this.numSegments; i++) ctx.lineTo(leftHull[i].x, leftHull[i].y);
                for (let i = this.numSegments - 1; i >= 0; i--) ctx.lineTo(rightHull[i].x, rightHull[i].y);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = "rgba(0,0,0,0.1)";
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = 'white';
                let eyeAngle = Math.atan2(this.segments[0].y - this.segments[1].y, this.segments[0].x - this.segments[1].x);
                let ex = this.segments[0].x + Math.cos(eyeAngle - Math.PI/2) * widths[0] * 0.5;
                let ey = this.segments[0].y + Math.sin(eyeAngle - Math.PI/2) * widths[0] * 0.5;
                ctx.beginPath(); ctx.arc(ex, ey, 3.5*this.scale, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = 'black';
                ctx.beginPath(); ctx.arc(ex + Math.cos(eyeAngle)*1.5*this.scale, ey + Math.sin(eyeAngle)*1.5*this.scale, 1.8*this.scale, 0, Math.PI*2); ctx.fill();
            }
        }

        const colors = [
            ['#ff6b6b', '#c0392b'], ['#feca57', '#e1b12c'], ['#48dbfb', '#0abde3'], 
            ['#1dd1a1', '#10ac84'], ['#ff9ff3', '#f368e0'], ['#ffc048', '#f39c12'],
            ['#ef5777', '#f53b57'], ['#0fb9b1', '#20bf6b'], ['#5f27cd', '#341f97']
        ];

        function initFishes() {
            for(let i=0; i<20; i++) {
                let col = colors[Math.floor(Math.random() * colors.length)];
                let f = new Fish(
                    Math.random() * width, 
                    waterLevel + 50 + Math.random() * (height - waterLevel - 100), 
                    0.8 + Math.random() * 0.6, 
                    col[0], col[1]
                );
                fishes.push(f);
            }
        }

        function spawnNewFish() {
            // Spawn just outside lateral bounds to swim in
            let side = Math.random() > 0.5 ? -50 : width + 50;
            let col = colors[Math.floor(Math.random() * colors.length)];
            let f = new Fish(
                side,
                waterLevel + 50 + Math.random() * (height - waterLevel - 100),
                0.8 + Math.random() * 0.6,
                col[0], col[1]
            );
            if (side < 0) f.vx = 2; else f.vx = -2; // Send towards center
            fishes.push(f);
        }

        function getMousePos(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            mouse.x = pos.x; mouse.y = pos.y;
            mouse.prevX = pos.x; mouse.prevY = pos.y;
            mouse.isDown = true;
            mouse.history = [];

            // Splashing surface
            if (Math.abs(mouse.y - waterLevel) < 40) {
                splash(mouse.x, 30);
                createSplashParticles(mouse.x, waterLevel, 15);
            }

            // CHEAT PREVENTION: Only allowed to grab on initial mousedown directly over a fish
            if (!grabbedFish) {
                // Iterate backwards to pick top-most visually (last rendered)
                for (let i = fishes.length - 1; i >= 0; i--) {
                    let f = fishes[i];
                    // Allow grabbing if swimming (0), airborne (2), recovering (3), or jumping (5)
                    if ((f.state === 0 || f.state === 2 || f.state === 3 || f.state === 5) && Math.hypot(mouse.x - f.x, mouse.y - f.y) <= f.radius * 2) {
                        grabbedFish = f;
                        f.state = 1;
                        f.highestY = Infinity;
                        f.wasThrownByPlayer = true; // Mark as player-handled
                        splash(f.x, 15);
                        break; // Grab only one
                    }
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const pos = getMousePos(e);
            mouse.prevX = mouse.x; mouse.prevY = mouse.y;
            mouse.x = pos.x; mouse.y = pos.y;

            mouse.history.push({x: mouse.x, y: mouse.y});
            if(mouse.history.length > 5) mouse.history.shift();

            // Drag through surface
            if ((mouse.prevY < waterLevel && mouse.y >= waterLevel) || 
                (mouse.prevY > waterLevel && mouse.y <= waterLevel)) {
                splash(mouse.x, mouse.isDown ? 25 : 10);
                if(mouse.isDown) createSplashParticles(mouse.x, waterLevel, 8);
            }

            // Dragging through water
            if (mouse.isDown && !grabbedFish && mouse.y > waterLevel) {
                splash(mouse.x, (Math.random() - 0.5) * 8);
                if (Math.random() < 0.3) { // Spawn bubbles occasionally
                    spawnBubble(mouse.x, mouse.y);
                }
            }
        });

        canvas.addEventListener('mouseup', () => {
            mouse.isDown = false;
            
            if (grabbedFish) {
                grabbedFish.state = 2; // Throw into air
                grabbedFish = null;
            }
        });

        // Touch support mapping to mouse events
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mousedown', {clientX: e.touches[0].clientX, clientY: e.touches[0].clientY})); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mousemove', {clientX: e.touches[0].clientX, clientY: e.touches[0].clientY})); }, {passive: false});
        canvas.addEventListener('touchend', () => { canvas.dispatchEvent(new MouseEvent('mouseup')); });

        function drawEnvironment() {
            // Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, width, waterLevel);

            // Water Gradient
            let waterGrad = ctx.createLinearGradient(0, waterLevel, 0, height);
            waterGrad.addColorStop(0, '#0097e6');
            waterGrad.addColorStop(1, '#003e6b');
            ctx.fillStyle = waterGrad;
            
            // Draw surface polygon
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, waterLevel + springs[0].y);
            for (let i = 0; i < SPRING_COUNT; i++) {
                let px = (i / (SPRING_COUNT - 1)) * width;
                let py = waterLevel + springs[i].y;
                ctx.lineTo(px, py);
            }
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();

            // Sand
            ctx.fillStyle = '#d1ccc0';
            ctx.fillRect(0, height - 30, width, 30);
            
            // Light Rays
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            for(let i=0; i<4; i++) {
                ctx.beginPath();
                let xOff = (width * 0.25) * i;
                ctx.moveTo(xOff, waterLevel);
                ctx.lineTo(xOff + 200 + Math.sin(timeElapsed*0.001 + i)*80, height);
                ctx.lineTo(xOff + 400 + Math.sin(timeElapsed*0.001 + i)*80, height);
                ctx.lineTo(xOff + 200, waterLevel);
                ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';
        }

        function updateEffects() {
            // Update Particles
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.vy += 0.3; // Gravity
                p.y += p.vy;
                p.life -= p.decay;
                
                if(p.life <= 0 || p.y > height) {
                    particles.splice(i, 1);
                    continue;
                }
                
                ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            }

            // Update Bubbles
            for(let i = bubbles.length - 1; i >= 0; i--) {
                let b = bubbles[i];
                b.y -= b.speed;
                b.x += Math.sin(timeElapsed * 0.005 + b.wobble) * 1.5;
                
                const index = Math.floor((b.x / width) * Math.max(SPRING_COUNT - 1, 1));
                let localWaterLevel = waterLevel;
                if(index >= 0 && index < SPRING_COUNT) localWaterLevel += springs[index].y;

                if (b.y < localWaterLevel) {
                    bubbles.splice(i, 1); // Pop at surface
                    splash(b.x, -2);
                } else {
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }

        function loop(timestamp) {
            timeElapsed = timestamp;
            ctx.clearRect(0, 0, width, height);

            updateWaterSurface();
            drawEnvironment();
            updateEffects();
            
            // Loop backwards for active fishes to safely splice if needed
            for (let i = fishes.length - 1; i >= 0; i--) {
                let f = fishes[i];
                f.update();
                
                if (f.isDead) {
                    fishes.splice(i, 1);
                } else {
                    f.draw();
                }
            }

            // Update dead fishes (removal after 30s)
            let now = Date.now();
            for (let i = deadFishes.length - 1; i >= 0; i--) {
                let df = deadFishes[i];
                df.update();
                
                // Fade out at end of life
                let age = now - df.deathTime;
                if (age > 27000) {
                    ctx.globalAlpha = Math.max(0, 1 - (age - 27000) / 3000);
                }
                
                df.draw();
                ctx.globalAlpha = 1.0;

                if (age > 30000) {
                    deadFishes.splice(i, 1);
                }
            }

            requestAnimationFrame(loop);
        }

        initFishes();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
